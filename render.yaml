databases:
  - name: kbch-db
    plan: 0.1c-256mb
    diskSizeGB: 5
    postgresMajorVersion: '16'
    ipAllowList: []
    databaseName: kbch
    user: kbch

services:
  - type: web
    name: kbch-api
    runtime: docker
    rootDir: backend
    plan: 0.5c-512mb
    disk:
      name: kbch-media
      mountPath: /app/media
      sizeGB: 1
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kbch-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: '1'
      - key: MEDIA_DIR
        value: /app/media
      - key: TRUST_PROXY
        value: 'true'
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_NAME
        value: Администратор
      - key: EMAIL_BACKEND
        value: smtp
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PAYMENT_METHODS
        value: kaspi_transfer,cash,test_card,test_kaspi
      - key: KASPI_PHONE
        sync: false
      - key: KASPI_RECEIVER
        sync: false
      - key: KASPI_PAY_LINK
        sync: false
      - key: KASPI_MERCHANT_ID
        sync: false
      - key: KASPI_API_KEY
        sync: false
      - key: KASPI_WEBHOOK_SECRET
        sync: false

  - type: web
    name: kbch-site
    runtime: static
    buildCommand: python3 deploy/prepare_frontend.py --api-url-from-env API_URL
    staticPublishPath: .public
    envVars:
      - key: API_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /env.js
        name: Cache-Control
        value: no-store
