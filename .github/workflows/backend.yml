# Тесты бэкенда при каждом изменении папки backend/: на SQLite и на настоящем PostgreSQL (как на сервере).
name: Тесты бэкенда

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kbch_test
          POSTGRES_USER: kbch
          POSTGRES_PASSWORD: kbch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kbch" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PG_URL: postgresql+asyncpg://kbch:kbch@localhost:5432/kbch_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      # миграции на PostgreSQL: применяются, совпадают с моделями, откатываются
      - name: Миграции
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: ${{ env.PG_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Тесты
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && env.PG_URL || '' }}
        run: python -m pytest -q

      # production не должен запускаться с настройками по умолчанию
      - name: Проверка настроек production
        env:
          ENVIRONMENT: production
        run: |
          if python -m app.cli check; then echo "production запустился бы без настроек!"; exit 1; fi
