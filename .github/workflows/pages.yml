# GitHub discovers workflows only here; implementation lives in demo/github-pages/.
name: GitHub Pages — demo

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'demo/**', 'deploy/prepare_frontend.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  demo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: available
        run: if test -f demo/github-pages/action.yml; then echo "enabled=true" >> "$GITHUB_OUTPUT"; fi
      - id: publish
        if: steps.available.outputs.enabled == 'true'
        uses: ./demo/github-pages
