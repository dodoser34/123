name: Тесты сайта

on:
  push:
    paths: ['frontend/**', 'tests/**', 'demo/**', 'deploy/prepare_frontend.py', 'pytest.ini', '.github/workflows/checks.yml']
  pull_request:
    paths: ['frontend/**', 'tests/**', 'demo/**', 'deploy/prepare_frontend.py']

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Синтаксис всех JS-файлов
        run: find frontend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Тесты логики сайта
        run: node --test tests/frontend/*.test.cjs

  public-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest==8.3.4 pytest-asyncio==0.24.0
      - name: Тесты сборки .public/
        run: python -m pytest -q
      - name: Optional extension tests
        run: if test -d demo/tests; then python -m pytest demo/tests -q; fi
      - name: Сборка .public/ проходит
        run: python deploy/prepare_frontend.py
