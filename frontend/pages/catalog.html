<!doctype html>
<html lang="ru" data-base="../">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>K-Beauty | C-Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css?v=23" />
    <script src="../js/app.js?v=23" data-page="catalog"></script>
  </head>
  <body data-page="catalog">
    <header id="site-header"></header>

    <main class="section-clip">
      <div class="container">
        <nav class="breadcrumbs" data-t-label="common.breadcrumbs.label" id="crumbs"></nav>
        <div class="page-head catalog-head">
          <div>
            <h1 id="cat-title" data-t="catalog.title"></h1>
            <p class="lead" id="cat-lead" data-t="catalog.lead"></p>
          </div>
          <form class="catalog-search" role="search" id="cat-search">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="11" cy="11" r="7.5" />
              <path d="m20.5 20.5-4.2-4.2" />
            </svg>
            <label class="sr-only" for="q" data-t="catalog.search.label"></label>
            <input id="q" type="search" data-t-placeholder="catalog.search.placeholder" autocomplete="off" />
          </form>
        </div>
      </div>
      <img
        class="decor botanical catalog-decor"
        src="../assets/images/decor/eucalyptus-round-spray.png"
        width="1536"
        height="1024"
        decoding="async"
        alt=""
        aria-hidden="true"
        data-decor

      />

      <div class="container page-body">
        <div class="panel catalog-layout">
          <aside class="cat-aside" id="aside" data-t-label="catalog.aside.label"></aside>
          <div>
            <div class="toolbar">
              <div class="toolbar-left">
                <button class="dropdown-btn filters-btn" type="button" id="open-filters"></button>
                <div class="dropdown" id="sort-dd"></div>
                <div class="dropdown" id="price-dd"></div>
              </div>
              <div class="view-switch" id="view-switch" role="group" data-t-label="catalog.toolbar.viewLabel"></div>
            </div>
            <div class="found" id="found" aria-live="polite"></div>
            <div class="products-grid" id="grid"></div>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </div>
      <div class="drawer-backdrop" id="backdrop"></div>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
