<!doctype html>
<html lang="ru" data-base="../">
  <head>
    <meta charset="utf-8" />
    <!-- Политика безопасности: скрипты только с этого сайта, без встроенных обработчиков (защита от XSS) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>K-Beauty | C-Health</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/main.css?v=21" />
    <script src="../js/app.js?v=21" data-page="delivery"></script>
  </head>
  <body data-page="delivery">
    <header id="site-header"></header>

    <main class="container page-body">
      <nav class="breadcrumbs" data-t-label="common.breadcrumbs.label">
        <a href="../index.html" data-t="common.breadcrumbs.home"></a><span aria-hidden="true">/</span><span data-t="delivery.title"></span>
      </nav>

      <div class="delivery-layout">
        <div>
          <div class="page-head">
            <h1 data-t="delivery.title"></h1>
            <p class="lead" data-t="delivery.lead"></p>
          </div>
          <section class="panel info-panel reveal" aria-labelledby="h-del">
            <h2 id="h-del" data-t="delivery.deliveryTitle"></h2>
            <div id="delivery-rows"></div>
          </section>
          <section class="panel info-panel reveal" id="pay" aria-labelledby="h-pay">
            <h2 id="h-pay" data-t="delivery.payTitle"></h2>
            <div id="pay-rows"></div>
          </section>
        </div>
        <aside class="delivery-side reveal" aria-hidden="true">
          <img src="../assets/images/pages/delivery/delivery-side.jpg" alt="" data-decor />
          <span class="hand"
            ><span data-t="delivery.sideCaption"></span
            ><svg class="icon" viewBox="0 0 24 24">
              <path
                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"
              /></svg
          ></span>
        </aside>
      </div>

      <section class="section delivery-section">
        <h2 class="reveal" data-t="delivery.ratesTitle"></h2>
        <div class="panel table-wrap reveal">
          <table class="table">
            <thead>
              <tr id="rates-head"></tr>
            </thead>
            <tbody id="rates"></tbody>
          </table>
          <p class="table-note" data-t="delivery.ratesNote"></p>
        </div>
      </section>

      <section class="section delivery-section" id="faq">
        <div class="botanical-title faq-title reveal">
          <h2 data-t="delivery.faqTitle"></h2>
        </div>
        <div class="panel faq reveal" id="faq-list"></div>
      </section>

      <section class="section delivery-section">
        <div class="panel cta-band reveal">
          <div class="cta-band-text">
            <h2 data-t="delivery.cta.title"></h2>
            <p data-t="delivery.cta.text"></p>
          </div>
          <a class="btn btn-primary" id="wa-btn" target="_blank" rel="noopener"
            ><svg class="icon" viewBox="0 0 24 24">
              <path d="m22 3-7.5 18-3.5-7.5L3.5 10Z" />
              <path d="M22 3 11 13.5" />
            </svg>
            <span data-t="delivery.cta.button"></span>
            <svg class="icon icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg
          ></a>
          <img
            class="decor botanical cta-botanical"
            src="../assets/images/decor/tea-branch.png"
            width="1536"
            height="1024"
            loading="lazy"
            decoding="async"
            alt=""
            aria-hidden="true"
            data-decor
           
          />
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>
  </body>
</html>
