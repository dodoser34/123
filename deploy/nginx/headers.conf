# Заголовки безопасности. Подключаются (include) в каждый блок, где есть свои add_header:
# в Nginx блок со своими add_header перестаёт наследовать общие.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# скрипты — только с этого сайта (+ хеш служебного скрипта страницы 404.html; меняете тот скрипт — обновите хеш);
# встраивать сайт в чужие страницы нельзя
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-q0Wd0OPZMU86IOVcSP9fpo4ghh4/m9OeKf2TNC7is7E='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
