# Общие правила защиты Nginx (подключаются раньше настроек сайта).

# не показывать версию Nginx в ответах и на страницах ошибок
server_tokens off;

# Ограничение частоты запросов с одного IP (первый рубеж защиты от DDoS и перебора паролей;
# второй — в самом API, см. backend/app/core/rate_limit.py)
limit_req_zone $binary_remote_addr zone=site:10m rate=30r/s;   # страницы, стили, картинки
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;    # запросы к API
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # вход, регистрация, коды из писем
limit_conn_zone $binary_remote_addr zone=perip:10m;            # одновременные соединения
limit_req_status 429;
limit_conn_status 429;

# медленные клиенты не держат соединения (защита от атак «медленными запросами»)
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;
large_client_header_buffers 4 16k;
