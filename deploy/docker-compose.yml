name: kbch

x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '5' }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kbch}
      POSTGRES_USER: ${POSTGRES_USER:-kbch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заполните POSTGRES_PASSWORD в deploy/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: >-
      postgres
      -c max_connections=50
      -c idle_in_transaction_session_timeout=60000
      -c log_min_duration_statement=2000
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kbch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-kbch}
      FRONTEND_URL: https://${DOMAIN:?заполните DOMAIN в deploy/.env}
      PUBLIC_API_URL: https://${DOMAIN}/api
      CORS_ORIGINS: https://${DOMAIN},https://www.${DOMAIN}
      ALLOWED_HOSTS: ${DOMAIN},www.${DOMAIN},backend,localhost
      TRUST_PROXY: 'true'
      PROXY_HOPS: '1'
      EMAIL_BACKEND: smtp
      MEDIA_DIR: /app/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
      - ../.public:/frontend:ro
    networks: [internal, public]
    expose: ['8000']
    security_opt: ['no-new-privileges:true']
    logging: *logging
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend]
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN}
    command:
      - /bin/sh
      - -c
      - |
        while :; do
          sleep 6h & wait $${!}
          nginx -t && nginx -s reload
        done &
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - ../.public:/usr/share/nginx/html:ro
      - ./env.js:/usr/share/nginx/html/env.js:ro
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/security.conf:/etc/nginx/conf.d/00-security.conf:ro
      - ./nginx/headers.conf:/etc/nginx/snippets/headers.conf:ro
      - media:/srv/media:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks: [internal, public]
    security_opt: ['no-new-privileges:true']
    logging: *logging

  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [public]
    logging: *logging
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  certbot-init:
    image: certbot/certbot:v2.11.0
    profiles: ['init']
    ports: ['80:80']
    volumes:
      - letsencrypt:/etc/letsencrypt
    networks: [public]
    command: >-
      certonly --standalone --agree-tos --no-eff-email
      -m ${LETSENCRYPT_EMAIL:?заполните LETSENCRYPT_EMAIL в deploy/.env}
      -d ${DOMAIN} -d www.${DOMAIN}

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-kbch}
      PGUSER: ${POSTGRES_USER:-kbch}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - media:/media:ro
    networks: [internal]
    security_opt: ['no-new-privileges:true']
    logging: *logging
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; umask 077;
      while :; do
        stamp=$$(date +%Y-%m-%d_%H%M%S);
        f=/backups/kbch-$$stamp.dump; m=/backups/media-$$stamp.tgz;
        if pg_dump -Fc -f "$$f.tmp" && tar czf "$$m.tmp" -C /media .; then
          mv "$$f.tmp" "$$f"; mv "$$m.tmp" "$$m"; echo "backup: $$stamp (database + media)";
          find /backups -name "kbch-*.dump" -mtime +$${KEEP_DAYS} -delete;
          find /backups -name "media-*.tgz" -mtime +$${KEEP_DAYS} -delete;
        else rm -f "$$f.tmp" "$$m.tmp"; echo "backup FAILED (old copies kept)" >&2; fi;
        sleep 24h & wait $${!};
      done'

networks:
  internal:
    internal: true
  public: {}

volumes:
  pgdata:
  media:
  letsencrypt:
  certbot-www:
